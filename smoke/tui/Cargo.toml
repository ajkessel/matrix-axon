[package]
name = "axon-smoke-tui"
description = "Black-box PTY smoke harness for the axon-tui binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate is a black-box smoke harness: it spawns the shipped `axon-tui`
# binary and drives it over a PTY against an in-process Axum stub of the Axon
# API. It must NEVER depend on any `axon-*` product crate (CI enforces this); all
# wire types are handwritten from the checked-in `openapi/` contract.

[[bin]]
name = "axon-smoke-tui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
portable-pty = { workspace = true }
vt100 = { workspace = true }
