services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axon}
      POSTGRES_DB: ${POSTGRES_DB:-axon}
    ports:
      # Host port is configurable to avoid clashing with a local Postgres
      # (e.g. Homebrew/Postgres.app on macOS). Override POSTGRES_PORT in .env
      # and update DATABASE_URL to match.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - axon-pgdata:/var/lib/postgresql/data

volumes:
  axon-pgdata:
