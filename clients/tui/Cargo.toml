[package]
name = "axon-tui"
description = "Terminal client for the Axon API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "axon-tui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
reqwest = { workspace = true, features = ["json", "query", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { workspace = true, features = ["serde"] }
ratatui = { workspace = true }
crossterm = { workspace = true }
emojis = "0.8"
ruma-html = "0.8"
