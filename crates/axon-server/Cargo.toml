[package]
name = "axon-server"
description = "Axon binary — wires all crates together and owns the process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "axon"
path = "src/main.rs"

[dependencies]
axon-core   = { workspace = true }
axon-store  = { workspace = true }
axon-sync   = { workspace = true }
axon-crypto = { workspace = true }
axon-search = { workspace = true }
axon-media  = { workspace = true }
axon-api    = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "process"] }
tokio-util = { workspace = true }
axum  = { workspace = true }
anyhow = { workspace = true }
# Implements axon-api's async MessageSender trait for the gateway adapter.
async-trait = { workspace = true }
uuid = { workspace = true }
# Subcommand parsing for the `axon` binary (`axon token …`, M7b).
clap = { workspace = true }
serde_json = { workspace = true }
# `axon init` (M13, ADR 0051): CSPRNG for the generated store_key, toml_edit to
# render the starter config, and `url` to parse the Postgres URL when offering to
# start a matching local Docker container.
rand = { workspace = true }
toml_edit = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
sqlx-postgres = { workspace = true }
crossterm = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
dotenvy = { workspace = true }
# OAuth 2.0 authorization server (M14, ADR 0054): builds each configured
# provider's `GenericOidcProvider` (discovery-doc fetch) at boot.
reqwest = { workspace = true, features = ["json", "form", "rustls"] }
