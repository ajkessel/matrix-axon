name: Cross-platform build
#
# Builds the whole workspace for every platform we ship binaries for, all from
# a single [binary-builder] Linux runner:
#   - Linux (x86_64-unknown-linux-gnu) — native
#   - Windows (x86_64-pc-windows-gnu) — via `cross`, which drives a mingw-w64
#     Docker image; the runner's Docker daemon supplies this transparently.
#   - macOS, Intel + Apple Silicon (x86_64-apple-darwin, aarch64-apple-darwin)
#     — via osxcross, wrapping Apple's real clang/SDK. osxcross must already
#     be set up on the runner (scripts/setup-macos-cross.sh, run once by hand
#     with an SDK tarball you supply — Apple's SDK license means there is no
#     automated CI-side source for it).
#
# Every dependency in the graph is rustls/aws-lc-rs (no OpenSSL, no native-tls)
# and sqlx's Postgres driver is compiled in directly (no libpq), which is what
# makes cross-compiling the server crates at all viable without a matching
# native toolchain per platform.
#
# Each of the four build targets above (windows, linux, macos-intel,
# macos-silicon) uploads three zips — axon-tui-<target> (client only),
# axon-server-<target> (server only), and axon-<target> (both binaries) — so
# a release ends up with 12 binary assets plus GitHub's two auto-generated
# source archives. We intentionally ship per-arch macOS binaries rather than
# a lipo'd universal binary: it matches how the Windows/Linux zips are
# already one-arch-per-file, and avoids a fat binary silently masking a
# broken osxcross target for one architecture.

on:
  push:
    tags:
      - 'v*' 
      - 'beta-*'
      - 'alpha-*'
  workflow_dispatch:
    inputs:
      release:
        description: "Build with --release (uncheck for a faster debug build)"
        type: boolean
        default: true
      checks:
        description: "Perform linting and formatting checks"
        type: boolean
        default: true
      macos:
        description: "Build MacOS binaries"
        type: boolean
        default: true
      windows:
        description: "Build Windows binaries"
        type: boolean
        default: true
      linux:
        description: "Build Linux binaries"
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # cargo's built-in `dev` profile writes to target/<triple>/debug, not
  # target/<triple>/dev — this picks the matching directory name for whichever
  # profile flag we pass below, so every job/step agrees on where to look.
  PROFILE_DIR: ${{ (github.event.inputs.release != 'false') && 'release' || 'debug' }}
  RELEASE_FLAG: ${{ (github.event.inputs.release != 'false') && '--release' || '' }}

jobs:
  generate-thirdparty:
    name: Generate license disclosure
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate license disclosure file
        run: scripts/generate-thirdparty.sh

      - name: Upload license disclosure artifact
        uses: actions/upload-artifact@v7
        with:
          name: thirdparty-license
          path: build/THIRDPARTY
          if-no-files-found: error

  lint-fmt-test:
    name: rustfmt, clippy, and test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.checks != 'false' }}
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

  windows:
    name: Build for Windows
    needs: generate-thirdparty
    runs-on: windows-latest
    if: ${{ github.event.inputs.windows != 'false' }}
    steps:
      - name: Add rustup/cargo home and local binaries to PATH
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-windows" >> $GITHUB_ENV
          echo "CARGO_HOME=$HOME/.cargo-windows" >> $GITHUB_ENV
          echo "$HOME/.rustup-windows/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo-windows/bin" >> $GITHUB_PATH

      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Download license disclosure artifact
        uses: actions/download-artifact@v8
        with:
          name: thirdparty-license
          path: build

      - name: Install cross
        # cross-rs's tagged releases (latest: v0.2.5, 2023) lag well behind
        # main, which is what upstream actually maintains/recommends — so we
        # pin to a specific commit rather than a stale tag. Bump this SHA
        # deliberately (and clear the cached binary off binary-builder) when
        # a newer cross is needed; `command -v` only skips install once it's
        # already present, so this doesn't silently drift on its own.
        run: command -v cross >/dev/null || cargo install cross --locked --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a

      - name: Build workspace (Windows via cross/mingw-w64)
        # `cross` shells out to Docker; the runner's Docker daemon must be
        # reachable by whichever user runs the Actions runner service.
        run: CARGO_TARGET_DIR=target/cross/windows cross build --workspace --target x86_64-pc-windows-gnu ${{ env.RELEASE_FLAG }}

      - name: Zip binaries
        run: |
          BIN=target/cross/windows/x86_64-pc-windows-gnu/${{ env.PROFILE_DIR }}
          zip -j target/axon-tui-windows.zip $BIN/axon-tui.exe build/THIRDPARTY LICENSE.md
          zip -j target/axon-server-windows.zip $BIN/axon.exe build/THIRDPARTY LICENSE.md
          zip -j target/axon-windows.zip $BIN/axon.exe $BIN/axon-tui.exe build/THIRDPARTY LICENSE.md

      - name: Upload axon-tui artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-tui-windows.zip
          path: target/axon-tui-windows.zip
          if-no-files-found: error

      - name: Upload axon-server artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-server-windows.zip
          path: target/axon-server-windows.zip
          if-no-files-found: error

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-windows.zip
          path: target/axon-windows.zip
          if-no-files-found: error

  macos:
    name: Build for MacOS (Intel and Silicon)
    needs: generate-thirdparty
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: intel
          - target: aarch64-apple-darwin
            arch: silicon
    runs-on: macos-latest
    if: ${{ github.event.inputs.macos != 'false' }}
    steps:
      - name: Add rustup/cargo home and local binaries to PATH
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-macos" >> $GITHUB_ENV
          echo "CARGO_HOME=$HOME/.cargo-macos" >> $GITHUB_ENV
          echo "$HOME/.rustup-macos/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo-macos/bin" >> $GITHUB_PATH

      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: macos-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-${{ matrix.target }}-cargo-

      - name: Check osxcross (macOS via osxcross)
        if: runner.os != 'macOS'
        run: |
          if [ ! -e /opt/axon/osxcross/env.sh ]; then
            echo 'osxcross not found, see scripts/setup-macos-cross.sh for more information'
            exit 1
          fi

      - name: Download license disclosure artifact
        uses: actions/download-artifact@v8
        with:
          name: thirdparty-license
          path: build

      - name: Build workspace (macOS via osxcross)
        if: runner.os != 'macOS'
        run: |
          source /opt/axon/osxcross/env.sh
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          cargo build --workspace --target ${{ matrix.target }} ${{ env.RELEASE_FLAG }}

      - name: Build workspace (macOS native)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          cargo build --workspace --target ${{ matrix.target }} ${{ env.RELEASE_FLAG }}

      - name: Zip binaries
        run: |
          BIN=target/${{ matrix.target }}/${{ env.PROFILE_DIR }}
          zip -j target/axon-tui-macos-${{ matrix.arch }}.zip $BIN/axon-tui build/THIRDPARTY LICENSE.md
          zip -j target/axon-server-macos-${{ matrix.arch }}.zip $BIN/axon build/THIRDPARTY LICENSE.md
          zip -j target/axon-macos-${{ matrix.arch }}.zip $BIN/axon $BIN/axon-tui build/THIRDPARTY LICENSE.md

      - name: Upload axon-tui artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-tui-macos-${{ matrix.arch }}.zip
          path: target/axon-tui-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload axon-server artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-server-macos-${{ matrix.arch }}.zip
          path: target/axon-server-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-macos-${{ matrix.arch }}.zip
          path: target/axon-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux:
    name: Build for Linux
    needs: generate-thirdparty
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.linux != 'false' }}
    steps:
      - name: Add rustup/cargo home and local binaries to PATH
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-linux" >> $GITHUB_ENV
          echo "CARGO_HOME=$HOME/.cargo-linux" >> $GITHUB_ENV
          echo "$HOME/.rustup-linux/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo-linux/bin" >> $GITHUB_PATH

      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/actions/check-environment

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Download license disclosure artifact
        uses: actions/download-artifact@v8
        with:
          name: thirdparty-license
          path: build

      - name: Build workspace (native Linux)
        if: runner.os == 'linux'
        run: CARGO_TARGET_DIR=target/cross/linux cargo build --workspace --target x86_64-unknown-linux-gnu ${{ env.RELEASE_FLAG }}

      - name: Install cross
        if: runner.os != 'linux'
        run: command -v cross >/dev/null || cargo install cross --locked --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a

      - name: Build workspace (cross-compile)
        if: runner.os != 'linux'
        run: CARGO_TARGET_DIR=target/cross/linux cross build --workspace --target x86_64-unknown-linux-gnu ${{ env.RELEASE_FLAG }}
      - name: Zip binaries
        run: |
          BIN=target/cross/linux/x86_64-unknown-linux-gnu/${{ env.PROFILE_DIR }}
          zip -j target/axon-tui-linux.zip $BIN/axon-tui build/THIRDPARTY LICENSE.md
          zip -j target/axon-server-linux.zip $BIN/axon build/THIRDPARTY LICENSE.md
          zip -j target/axon-linux.zip $BIN/axon $BIN/axon-tui build/THIRDPARTY LICENSE.md

      - name: Upload axon-tui artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-tui-linux.zip
          path: target/axon-tui-linux.zip
          if-no-files-found: error

      - name: Upload axon-server artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-server-linux.zip
          path: target/axon-server-linux.zip
          if-no-files-found: error

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: axon-linux.zip
          path: target/axon-linux.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    if: ${{ !failure() && !cancelled() && github.ref_type == 'tag' }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all compiled binaries
        uses: actions/download-artifact@v8
        with:
          pattern: axon*.zip
          path: release-binaries
          merge-multiple: true

      - name: Publish binaries
        uses: softprops/action-gh-release@v3
        with:
          files: release-binaries/*
