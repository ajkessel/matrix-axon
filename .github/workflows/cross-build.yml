name: Cross-platform build
#
# Builds the whole workspace for every platform we ship binaries for, all from
# a single [binary-builder] Linux runner:
#   - Linux (x86_64-unknown-linux-gnu) — native
#   - Windows (x86_64-pc-windows-gnu) — via `cross`, which drives a mingw-w64
#     Docker image; the runner's Docker daemon supplies this transparently.
#   - macOS, Intel + Apple Silicon (x86_64-apple-darwin, aarch64-apple-darwin)
#     — via osxcross, wrapping Apple's real clang/SDK. osxcross must already
#     be set up on the runner (scripts/setup-macos-cross.sh, run once by hand
#     with an SDK tarball you supply — Apple's SDK license means there is no
#     automated CI-side source for it).
#
# Every dependency in the graph is rustls/aws-lc-rs (no OpenSSL, no native-tls)
# and sqlx's Postgres driver is compiled in directly (no libpq), which is what
# makes cross-compiling the server crates at all viable without a matching
# native toolchain per platform.

on:
  push:
    branches:
      - main
    tags:
      - 'v*' 
  workflow_dispatch:
    inputs:
      release:
        description: "Build with --release (uncheck for a faster debug build)"
        type: boolean
        default: true
      checks:
        description: "Perform linting and formatting checks"
        type: boolean
        default: true
      macos:
        description: "Build MacOS binaries"
        type: boolean
        default: true
      windows:
        description: "Build Windows binaries"
        type: boolean
        default: true
      linux:
        description: "Build Linux binaries"
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # cargo's built-in `dev` profile writes to target/<triple>/debug, not
  # target/<triple>/dev — this picks the matching directory name for whichever
  # profile flag we pass below, so every job/step agrees on where to look.
  PROFILE_DIR: ${{ (github.event.inputs.release != 'false') && 'release' || 'debug' }}
  RELEASE_FLAG: ${{ (github.event.inputs.release != 'false') && '--release' || '' }}

jobs:
  lint-fmt-test:
    runs-on:
      group: binary-builder
      labels: [self-hosted]
    if: ${{ github.event.inputs.checks != 'false' }}
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/workflows/check-environment.yml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

  windows:
    if: ${{ github.event.inputs.windows != 'false' }}
    runs-on:
      group: binary-builder
      labels: [self-hosted]
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/workflows/check-environment.yml
        with:
          require-docker: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install cross
        # cross-rs's tagged releases (latest: v0.2.5, 2023) lag well behind
        # main, which is what upstream actually maintains/recommends — so we
        # pin to a specific commit rather than a stale tag. Bump this SHA
        # deliberately (and clear the cached binary off binary-builder) when
        # a newer cross is needed; `command -v` only skips install once it's
        # already present, so this doesn't silently drift on its own.
        run: command -v cross >/dev/null || cargo install cross --locked --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a

      - name: Build workspace (Windows via cross/mingw-w64)
        # `cross` shells out to Docker; the runner's Docker daemon must be
        # reachable by whichever user runs the Actions runner service.
        run: cross build --workspace --target x86_64-pc-windows-gnu ${{ env.RELEASE_FLAG }}

      - name: Zip binaries
        run: zip -j target/x86_64-pc-windows-gnu/${{ env.PROFILE_DIR }}/axon-axon-x86_64-pc-windows-gnu.zip target/x86_64-pc-windows-gnu/${{ env.PROFILE_DIR }}/axon.exe target/x86_64-pc-windows-gnu/${{ env.PROFILE_DIR }}/axon-tui.exe 

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: axon-x86_64-pc-windows-gnu
          path: target/x86_64-pc-windows-gnu/${{ env.PROFILE_DIR }}/axon-axon-x86_64-pc-windows-gnu.zip
          if-no-files-found: error

  macos:
    if: ${{ github.event.inputs.macos != 'false' }}
    runs-on:
      group: binary-builder
      labels: [self-hosted]
    env:
      RUSTUP_HOME: .rustup-macos
      CARGO_HOME: .cargo-macos
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: check environment
        uses: ./.github/workflows/check-environment.yml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: macos-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-${{ matrix.target }}-cargo-

      - name: Check osxcross (macOS via osxcross)
        if: runner.os != 'macOS'
        run: |
          if [ ! -e /opt/axon/osxcross/env.sh ]; then
            echo 'osxcross not found, see scripts/setup-macos-cross.sh for more information'
            exit 1
          fi

      - name: Build workspace (macOS via osxcross)
        if: runner.os != 'macOS'
        run: |
          source /opt/axon/osxcross/env.sh
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          cargo build --workspace --target ${{ matrix.target }} ${{ env.RELEASE_FLAG }}

      - name: Build workspace (macOS native)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          cargo build --workspace --target ${{ matrix.target }} ${{ env.RELEASE_FLAG }}

      - name: Zip binaries
        run: zip -j target/${{ matrix.target }}/${{ env.PROFILE_DIR }}/axon-${{ matrix.target }}.zip target/${{ matrix.target }}/${{ env.PROFILE_DIR }}/axon target/${{ matrix.target }}/${{ env.PROFILE_DIR }}/axon-tui

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: axon-${{ matrix.target }}
          path: target/${{ matrix.target }}/${{ env.PROFILE_DIR }}/axon-${{ matrix.target }}.zip
          if-no-files-found: error

  linux:
    if: ${{ github.event.inputs.linux != 'false' }}
    runs-on:
      group: binary-builder
      labels: [self-hosted]
    env:
      RUSTUP_HOME: .rustup-linux
      CARGO_HOME: .cargo-linux
    steps:
      - name: checkout source code
        uses: actions/checkout@v7

      - name: check-environment
        uses: ./.github/workflows/check-environment.yml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build workspace (native Linux)
        run: cargo build --workspace --target x86_64-unknown-linux-gnu ${{ env.RELEASE_FLAG }}

      - name: Zip binaries
        run: zip -j target/x86_64-unknown-linux-gnu/${{ env.PROFILE_DIR }}/axon-x86_64-unknown-linux-gnu.zip target/x86_64-unknown-linux-gnu/${{ env.PROFILE_DIR }}/axon target/x86_64-unknown-linux-gnu/${{ env.PROFILE_DIR }}/axon-tui

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: axon-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/${{ env.PROFILE_DIR }}/axon-x86_64-unknown-linux-gnu.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    runs-on:
      group: binary-builder
      labels: [self-hosted]
    if: ${{ !failure() && !cancelled() && github.ref_type == 'tag' }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all compiled binaries
        uses: actions/download-artifact@v8
        with:
          pattern: axon*.zip
          path: release-binaries
          merge-multiple: true

      - name: Publish binaries
        uses: softprops/action-gh-release@v3
        with:
          files: release-binaries/*
